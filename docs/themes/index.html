<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the latest UltraStar Community Edition theme screenshots across screens and window sizes.">
  <meta name="theme-color" content="#0d1422">
  <title>Themes · UltraStar Community Edition</title>
  <link rel="icon" href="../assets/usce-mark.png" type="image/png">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery-data.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="../" aria-label="USCE home"><img src="../assets/usce-mark.png" alt="" width="34" height="34">USCE</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="../">About</a>
        <a href="./" aria-current="page">Themes</a>
        <a href="../contact/">Contact</a>
        <a href="../development/">Development</a>
        <a class="nav-release" href="https://github.com/UltraStar-CE/USCE/releases/latest">Releases</a>
      </nav>
    </div>
  </header>
  <main id="main" class="container theme-browser">
    <header class="theme-intro">
      <h1 id="gallery-title">Theme browser</h1>
      <p id="gallery-description">Browse the latest USCE screenshots across themes, game screens, and window sizes.</p>
      <p><a href="https://github.com/UltraStar-CE/Themes/blob/main/ARTWORK-PROVENANCE.md">Theme credits and licensing</a></p>
    </header>
    <nav class="theme-modes" aria-label="Gallery sections">
      <a id="screens-link" href="./" aria-current="page">Screens</a>
      <a id="skins-link" href="?gallery=skins">Skins</a>
    </nav>
    <form id="theme-filters" class="theme-filters" aria-label="Theme filters">
      <label for="screen">Screen
        <select id="screen" name="screen"><option value="">All screens</option></select>
      </label>
      <label for="theme">Theme
        <select id="theme" name="theme"><option value="">All themes</option></select>
      </label>
      <label for="resolution">Resolution
        <select id="resolution" name="resolution"><option value="">All resolutions</option></select>
      </label>
      <button type="reset">Reset filters</button>
    </form>
    <noscript><p>Enable JavaScript to browse the screenshots.</p></noscript>
    <p class="theme-results" id="theme-results" aria-live="polite"></p>
    <section id="theme-gallery" class="theme-grid" aria-label="Theme screenshots"></section>
    <nav class="theme-pagination" id="theme-pagination" aria-label="Gallery pages" hidden>
      <button id="previous-page" type="button">Previous</button>
      <span id="theme-page" aria-live="polite"></span>
      <button id="next-page" type="button">Next</button>
    </nav>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>UltraStar Community Edition</span>
      <div><a href="https://github.com/UltraStar-CE/USCE">GitHub</a><a href="https://usdx.eu/">UltraStar Deluxe</a></div>
    </div>
  </footer>
</body>
</html>
